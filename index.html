*{box-sizing:border-box}
html,body{margin:0;background:#fff;width:100%;font-family:Arial,Helvetica,sans-serif}
.page{position:relative;width:100%;line-height:0}
.base{display:block;width:100%;height:auto}

.fallback span{font-size:9px;display:block} .fallback strong{font-size:20px;display:block;margin-top:3px}

.coming{left:61.9%;top:78.0%;width:10.5%;height:5.8%;display:flex;align-items:center;justify-content:center;
background:#7388a6;color:#fff;border-radius:7px;font-weight:800;font-size:14px;line-height:1}
/* Put approved S/lightning mark over the incorrect plain bolt in current screenshot */
.smark{left:55.0%;top:66.1%;width:5.2%;height:11.0%;pointer-events:none}
/* invisible navigation hotspots */
.hot{position:absolute;z-index:10;display:block}
